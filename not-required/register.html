<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration | Admission Management System 2026-27</title>
  <meta name="description" content="Register an administrative account for the Admission Management System. Requires System Administrator approval before login.">
  
  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons 1.11.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Auth Extension CSS -->
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      
      <!-- Header -->
      <div class="auth-header">
        <div class="logo-emblem"><i class="bi bi-person-plus-fill"></i></div>
        <h2>Register Account</h2>
        <p>Admission Management System Administrator Account</p>
      </div>

      <!-- Alert Notification Container -->
      <div id="alertBox" class="d-none"></div>

      <!-- Registration Form -->
      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="mb-3">
          <label for="fullName" class="form-label">Full Name *</label>
          <input type="text" id="fullName" class="form-control" placeholder="e.g. Ramesh Kumar" required>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <label for="designation" class="form-label">Designation *</label>
            <input type="text" id="designation" class="form-control" placeholder="e.g. Principal / PGT CS" required>
          </div>
          <div class="col-md-6">
            <label for="kvName" class="form-label">KV / School Name *</label>
            <input type="text" id="kvName" class="form-control" placeholder="e.g. KV Devkund" required>
          </div>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <label for="username" class="form-label">Username *</label>
            <input type="text" id="username" class="form-control" placeholder="e.g. ramesh_k" required>
            <div class="form-text" style="font-size:0.7rem;">Unique, 3-30 letters/numbers</div>
          </div>
          <div class="col-md-6">
            <label for="mobile" class="form-label">Mobile Number *</label>
            <input type="tel" id="mobile" class="form-control" placeholder="e.g. 9876543210" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email Address *</label>
          <input type="email" id="email" class="form-control" placeholder="name@school.edu.in" required>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <label for="password" class="form-label">Password *</label>
            <input type="password" id="password" class="form-control" placeholder="Min 8 chars, 1 uppercase, 1 digit" required>
          </div>
          <div class="col-md-6">
            <label for="confirmPassword" class="form-label">Confirm Password *</label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required>
          </div>
        </div>

        <button type="submit" id="btnRegister" class="btn-auth-primary mt-2">
          <i class="bi bi-send-fill me-1"></i> Submit Registration Request
        </button>
      </form>

      <!-- Footer Link to Login -->
      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign In Here</a>
      </div>

    </div>

    <!-- Developer Credits Footer -->
    <div class="developer-credits text-center mt-4 mb-4" style="font-size: 0.78rem; color: rgba(255, 255, 255, 0.75);">
      <div class="fw-semibold text-white mb-1">
        <i class="bi bi-code-slash me-1 text-warning"></i> Designed & Developed by: <strong>Suraj Verma</strong>, JSA, KV Aurangabad (Patna Region)
      </div>
      <div>
        <i class="bi bi-envelope-fill me-1 text-warning"></i> Contact for Support or Feedback: <a href="mailto:surajvermakvs@gmail.com" class="text-warning text-decoration-none fw-semibold">surajvermakvs@gmail.com</a>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value.trim();
      const designation = document.getElementById('designation').value.trim();
      const kvName = document.getElementById('kvName').value.trim();
      const username = document.getElementById('username').value.trim();
      const mobile = document.getElementById('mobile').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      const alertBox = document.getElementById('alertBox');
      const btn = document.getElementById('btnRegister');

      alertBox.className = 'd-none';

      // Password Match Validation
      if (password !== confirmPassword) {
        showAlert('Password and Confirm Password do not match.', 'danger');
        return;
      }

      // Password Strength Validation
      if (password.length < 8 || !/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/[0-9]/.test(password)) {
        showAlert('Password must be at least 8 characters long and contain at least one uppercase letter, one lowercase letter, and one digit.', 'danger');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Submitting...';

      try {
        const response = await Auth.register({ fullName, designation, kvName, username, email, mobile, password, confirmPassword });
        const { status, data } = response;

        if (status === 201 && data.success) {
          showAlert(`
            <strong>Registration Submitted Successfully!</strong><br>
            Your account is awaiting approval from the System Administrator.<br>
            <span class="small text-muted">You will be able to log in once your request is approved by the Administrator.</span>
          `, 'success');

          document.getElementById('registerForm').reset();
        } else {
          showAlert(data.message || 'Registration failed.', 'danger');
        }
      } catch (err) {
        console.error('Registration error:', err);
        showAlert('Network error. Could not submit registration.', 'danger');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-send-fill me-1"></i> Submit Registration Request';
      }
    }

    function showAlert(msg, type = 'danger') {
      const alertBox = document.getElementById('alertBox');
      alertBox.className = `auth-alert alert-${type}`;
      alertBox.innerHTML = `
        <i class="bi ${type === 'success' ? 'bi-check-circle-fill' : type === 'warning' ? 'bi-exclamation-triangle-fill' : 'bi-x-circle-fill'} fs-5 flex-shrink-0"></i>
        <div>${msg}</div>
      `;
    }
  </script>
</body>
</html>
