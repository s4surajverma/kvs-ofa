<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Admission Management System 2026-27</title>
  <meta name="description" content="Secure login portal for Admission Management System. Access restricted to approved administrators and authorized staff.">
  
  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons 1.11.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Auth Extension CSS -->
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      
      <!-- Header -->
      <div class="auth-header">
        <div class="logo-emblem"><i class="bi bi-mortarboard-fill"></i></div>
        <h2>Sign In to Portal</h2>
        <p>Offline Admission Management System</p>
      </div>

      <!-- Alert Notification Container -->
      <div id="alertBox" class="d-none"></div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label for="identifier" class="form-label">Username or Email *</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person-fill"></i></span>
            <input type="text" id="identifier" class="form-control border-start-0" placeholder="Enter username or email" required autocomplete="username">
          </div>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="password" class="form-label mb-0">Password *</label>
            <a href="#" onclick="showForgotPasswordAlert(event)" class="small text-decoration-none text-purple fw-semibold" style="font-size: 0.78rem;">Forgot Password?</a>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock-fill"></i></span>
            <input type="password" id="password" class="form-control border-start-0" placeholder="Enter password" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" id="btnLogin" class="btn-auth-primary mt-2">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Account
        </button>
      </form>

      <!-- Footer Link to Register -->
      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register New Account</a>
      </div>

    </div>

    <!-- Developer Credits Footer -->
    <div class="developer-credits text-center mt-4" style="font-size: 0.78rem; color: rgba(255, 255, 255, 0.75);">
      <div class="fw-semibold text-white mb-1">
        <i class="bi bi-code-slash me-1 text-warning"></i> Designed & Developed by: <strong>Suraj Verma</strong>, JSA, KV Aurangabad (Patna Region)
      </div>
      <div>
        <i class="bi bi-envelope-fill me-1 text-warning"></i> Contact for Support or Feedback: <a href="mailto:surajvermakvs@gmail.com" class="text-warning text-decoration-none fw-semibold">surajvermakvs@gmail.com</a>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      
      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('alertBox');
      const btn = document.getElementById('btnLogin');

      alertBox.className = 'd-none';

      if (!identifier || !password) {
        showAlert('Please enter both username/email and password.', 'danger');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Authenticating...';

      try {
        const result = await Auth.login(identifier, password);

        if (result.success) {
          showAlert('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            if (result.user && result.user.role === 'SUPERADMIN') {
              window.location.href = '/superuser';
            } else {
              window.location.href = '/dashboard';
            }
          }, 800);
        } else {
          showAlert(result.message || 'Login failed. Please check credentials.', 'danger');
        }
      } catch (err) {
        console.error('Login error:', err);
        showAlert('Network error. Could not connect to authentication server.', 'danger');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Account';
      }
    }

    function showAlert(msg, type = 'danger') {
      const alertBox = document.getElementById('alertBox');
      alertBox.className = `auth-alert alert-${type}`;
      alertBox.innerHTML = `
        <i class="bi ${type === 'success' ? 'bi-check-circle-fill' : type === 'warning' ? 'bi-exclamation-triangle-fill' : 'bi-x-circle-fill'} fs-5 flex-shrink-0"></i>
        <div>${msg}</div>
      `;
    }

    function showForgotPasswordAlert(e) {
      e.preventDefault();
      showAlert('Password reset feature is managed by the System Administrator. Please contact your administrator to reset your password.', 'warning');
    }
  </script>
</body>
</html>
